[build-system]
requires = ["hatchling", "hatch-requirements-txt"]
build-backend = "hatchling.build"

[project]
name = "villanova-speech-llm"
version = "0.0.1"
description = "Speech LLM recipes for ASR and speech translation (English/Italian) with the FAMA or Whisper encoder and the Villanova or EuroLLM language model, built on SLAM-LLM."
readme = "README.md"
license = { file = "LICENSE" }
# torch 2.9.1 (the pinned version) needs Python 3.10+; the reference environment uses 3.12
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dynamic = ["dependencies"]

[project.urls]
"Homepage" = "https://github.com/vskadandale/Villanova-Speech-LLM"
"Bug Tracker" = "https://github.com/vskadandale/Villanova-Speech-LLM/issues"
"Upstream (SLAM-LLM)" = "https://github.com/X-LANCE/SLAM-LLM"

[tool.hatch.build]
exclude = [
  "dist/*",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slam_llm"]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]
