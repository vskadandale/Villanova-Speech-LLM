# Prompts live in YAML because Hydra command-line overrides only accept a small set of characters.
# Keep each string exactly as is, trailing spaces included: checkpoints were trained with these prompts.
# One prompt per task and direction, picked by each record's {src_lang}2{tgt_lang}
# (data/large_en_it_multitask_preprocessing.py; ASR records have tgt_lang = src_lang).
dataset_config:
    lang_prompts:
        en2en: "Transcribe speech to text."   # ASR: same prompt as scripts/asr/conf/transcribe.yaml
        it2it: "Transcribe speech to text."
        en2it: "Translate English speech to Italian text. "
        it2en: "Translate Italian speech to English text. "
